name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "markdown>=3.5,<4"

      - name: Consistency check (codes, price bands, references)
        run: python tools/check.py

      - name: Build static site from Markdown
        run: python tools/build_site.py --src . --out site --repo "${{ github.repository }}"

      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site: build from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
